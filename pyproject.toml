[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-classifier"
version = "0.1.0"
description = "Four-task fashion image classification with ResNet50, FastAPI, and Streamlit"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "Pillow>=10.4,<13",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "streamlit>=1.41,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
